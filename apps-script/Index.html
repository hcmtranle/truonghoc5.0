<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trường học 5.0</title><style>
:root{--g:#176953;--ink:#243c35;--line:#dfe8e1;--bg:#f4f8f5;--muted:#687a70}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.shell{min-height:100vh;display:flex}.side{width:250px;background:#fff;border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0}.brand{font-weight:800;font-size:22px;color:var(--g)}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.2px}.school{border-top:1px solid var(--line);margin-top:24px;padding:20px 8px;font-size:13px;font-weight:700}.nav{display:grid;gap:5px}.nav button{padding:11px;text-align:left;border-radius:8px;background:transparent;color:#557066}.nav button.active,.nav button:hover{background:#e8f4ed;color:var(--g);font-weight:700}.me{margin-top:auto;border-top:1px solid var(--line);padding:18px 8px 0}.me strong,.me small{display:block}.me small{color:var(--muted)}.main{margin-left:250px;width:calc(100% - 250px);display:flex;min-height:100vh;flex-direction:column}.top{padding:14px 34px;background:#fff;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.top small{display:block;color:var(--muted)}#clock{font-weight:700;color:var(--g);font-variant-numeric:tabular-nums}.ticker{overflow:hidden;background:#eaf5e6;color:#42714c;white-space:nowrap;padding:9px 0}.ticker span{display:inline-block;animation:marquee 28s linear infinite}@keyframes marquee{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}.page{max-width:1250px;width:100%;padding:28px 34px;margin:auto;flex:1}.footer{text-align:center;color:#718077;border-top:1px solid var(--line);padding:18px;font-size:12px;background:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:21px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.module{min-height:160px;display:flex;flex-direction:column}.module .emoji{font-size:30px}.module p{color:var(--muted);font-size:13px;flex:1}.btn{padding:9px 13px;border-radius:7px;border:1px solid var(--line);background:#fff;font-weight:650}.btn.primary{background:var(--g);color:white;border-color:var(--g)}.btn.danger{color:#a23d3d}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #edf1ed;padding:12px 0}.row:last-child{border:0}.role{font-size:11px;background:#e8f4ed;color:var(--g);padding:3px 7px;border-radius:5px}label{font-weight:650;font-size:13px;display:grid;gap:5px}input,textarea,select{width:100%;border:1px solid #cadad0;border-radius:7px;padding:10px;background:#fff}textarea{min-height:190px;resize:vertical}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#e5f3e8,#f8fbf7)}.login .card{width:min(520px,100%)}.login h1{color:var(--g);margin:0}.hint,.error{font-size:13px;padding:10px;border-radius:7px;margin:12px 0}.hint{background:#edf6ee;color:#487054}.error{background:#fff0ed;color:#963b31}.hidden{display:none!important}.notebook-header{text-align:center}.notebook-header h2{margin:14px 0 0}.notebook-header p{margin:3px}.sig{font-weight:700;text-align:right;margin-top:12px}.file{font-size:12px;color:var(--muted)}@media(max-width:760px){.side{position:static;width:100%;height:auto}.shell{display:block}.main{margin:0;width:100%}.top,.page{padding-left:17px;padding-right:17px}.grid,.form{grid-template-columns:1fr}.side .nav{grid-template-columns:repeat(2,1fr)}.me{margin-top:18px}.ticker span{animation-duration:20s}}
</style></head><body><div id="root"></div><script>
const $=s=>document.querySelector(s), root=$('#root');let token=sessionStorage.getItem('th50-token')||'', state=null;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function call(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message||e))).[fn](...args))}
function roleName(r){return {ADMIN:'Quản trị viên',LEADER:'Tổ trưởng',DEPUTY:'Tổ phó',TEACHER:'Giáo viên'}[r]||r}
function clock(){let d=new Date(),z={timeZone:'Asia/Ho_Chi_Minh'};let e=$('#clock');if(e)e.textContent=new Intl.DateTimeFormat('vi-VN',{...z,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d)+' · '+new Intl.DateTimeFormat('vi-VN',{...z,day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}setInterval(clock,1000);
function login(){root.innerHTML='<main class="login"><section class="card"><h1>🌿 Trường học 5.0</h1><p>Đăng nhập bằng mã xác thực gửi đến email. Người đăng ký lần đầu sẽ chờ quản trị viên phê duyệt.</p><form id="login-form" class="form"><label>Họ và tên<input name="name" required maxlength="100"></label><label>Email cá nhân<input name="email" type="email" required></label><label class="full">Số điện thoại<input name="phone" required placeholder="09..."></label><div class="full actions"><button class="btn primary">Gửi mã xác thực</button></div></form><form id="code-form" class="form hidden"><label class="full">Mã 6 số<input name="code" inputmode="numeric" maxlength="6" required></label><div class="full actions"><button class="btn primary">Xác thực và đăng nhập</button></div></form><div id="msg"></div></section></main>';let info;$('#login-form').onsubmit=async e=>{e.preventDefault();info=Object.fromEntries(new FormData(e.target));try{let r=await call('requestLogin',info);$('#msg').innerHTML='<p class="hint">'+esc(r.message)+'</p>';$('#code-form').classList.remove('hidden')}catch(x){$('#msg').innerHTML='<p class="error">'+esc(x.message)+'</p>'}};$('#code-form').onsubmit=async e=>{e.preventDefault();try{let r=await call('verifyLogin',{email:info.email,code:new FormData(e.target).get('code')});if(r.pending){$('#msg').innerHTML='<p class="hint">'+esc(r.message)+'</p>';return}token=r.token;sessionStorage.setItem('th50-token',token);await load()}catch(x){$('#msg').innerHTML='<p class="error">'+esc(x.message)+'</p>'}}}
async function load(){try{state=await call('bootstrap',token);app('dashboard')}catch(e){sessionStorage.removeItem('th50-token');token='';login()}}
function layout(page,content){let u=state.user, admin=u.role==='ADMIN', leader=['ADMIN','LEADER','DEPUTY'].includes(u.role);root.innerHTML='<div class="shell"><aside class="side"><div class="brand">Trường học <span>5.0</span><small>KẾT NỐI & PHÁT TRIỂN</small></div><div class="school">TRƯỜNG TIỂU HỌC TRƯƠNG ĐỊNH<br><small>Tổ chuyên môn 4</small></div><nav class="nav"><button data-p="dashboard">⌂ Dashboard</button><button data-p="notebooks">📝 Sổ ghi chép họp</button>'+ (admin?'<button data-p="modules">🧩 Quản lý module</button><button data-p="approvals">✓ Duyệt tài khoản</button>':'') +'</nav><div class="me"><strong>'+esc(u.name)+'</strong><small>'+roleName(u.role)+' · '+esc(u.email)+'</small><button id="logout" class="btn" style="margin-top:10px">Đăng xuất</button></div></aside><main class="main"><header class="top"><div><small>ỦY BAN NHÂN DÂN PHƯỜNG ĐÔNG HƯNG THUẬN</small><b>TRƯỜNG TIỂU HỌC TRƯƠNG ĐỊNH</b></div><div id="clock"></div></header><div class="ticker"><span>🌼 📚 ✨ Chào mừng quý Thầy cô Tổ chuyên môn 4 - TRƯỜNG TIỂU HỌC TRƯƠNG ĐỊNH. Chúc quý Thầy cô một ngày làm việc hiệu quả! ✨ 🌿 🌼</span></div><section class="page">'+content+'</section><footer class="footer">Hệ thống được thiết kế bởi Cô Trần Thị Thu Hương và Thầy Lê Thành Tạo.<br>Mọi đóng góp xin gửi về: <a href="mailto:hcmtranle@gmail.com">hcmtranle@gmail.com</a></footer></main></div>';document.querySelectorAll('[data-p]').forEach(b=>{if(b.dataset.p===page)b.classList.add('active');b.onclick=()=>app(b.dataset.p)});$('#logout').onclick=async()=>{try{await call('logout',token)}finally{token='';sessionStorage.removeItem('th50-token');login()}};clock()}
function app(page){if(page==='dashboard')return dashboard();if(page==='modules')return modules();if(page==='approvals')return approvals();if(page==='notebooks')return notebooks()}
function dashboard(){const ms=state.modules||[],links=state.systemLinks;let systems=links?'<section class="card"><h2>🔗 Liên kết hệ thống</h2><p class="file">Các liên kết quản trị được tạo và lưu trong không gian Drive của nhà trường.</p><div class="actions" style="justify-content:flex-start"><a class="btn" target="_blank" rel="noopener" href="'+esc(links.github)+'">🐙 GitHub Repository</a><a class="btn" target="_blank" rel="noopener" href="'+esc(links.sheet)+'">📊 Google Sheet (Data)</a><a class="btn" target="_blank" rel="noopener" href="'+esc(links.drive)+'">📁 Thư mục Drive dự án</a></div></section>':'';layout('dashboard','<h1>Dashboard</h1><p>Không gian chung của nhà trường và các module được quản trị viên công bố.</p>'+systems+'<div class="grid">'+(ms.length?ms.map(m=>'<article class="card module"><div class="emoji">'+esc(m.icon)+'</div><h3>'+esc(m.name)+' <span class="role">'+esc(m.status)+'</span></h3><p>'+esc(m.description)+'</p>'+ (m.deployUrl?'<a class="btn primary" target="_blank" rel="noopener" href="'+esc(m.deployUrl)+'">Mở module</a>':'<span class="file">Đang hoàn thiện liên kết</span>')+'</article>').join(''):'<section class="card"><h3>Chưa có module được công bố</h3><p>Quản trị viên có thể thêm module mới từ khu vực quản lý.</p></section>')+'</div>')}
function modules(){if(state.user.role!=='ADMIN')return dashboard();layout('modules','<h1>Quản lý module</h1><p>Điền một lần các liên kết triển khai, Apps Script và Drive. Emoji tự gợi ý khi bỏ trống.</p><section class="card"><form id="module-form" class="form"><label>Icon (emoji)<input name="icon" maxlength="16" placeholder="Để trống để hệ thống gợi ý"></label><label>Trạng thái<select name="status"><option>LIVE</option><option>DRAFT</option><option>PAUSED</option></select></label><label class="full">Tên module<input name="name" required maxlength="100"></label><label class="full">Mô tả ngắn<textarea name="description" style="min-height:80px" maxlength="500"></textarea></label><label>URL deploy<input name="deployUrl" type="url" placeholder="https://..."></label><label>Script URL<input name="scriptUrl" type="url" placeholder="https://script.google.com/..."></label><label class="full">Drive URL<input name="driveUrl" type="url" placeholder="https://drive.google.com/..."></label><label><input type="checkbox" name="visible" checked style="width:auto"> Hiển thị cho người dùng</label><div class="actions"><button class="btn primary">Lưu module</button></div></form><div id="mmsg"></div></section><section class="card"><h2>Danh sách module</h2>'+state.modules.map(m=>'<div class="row"><div><b>'+esc(m.icon)+' '+esc(m.name)+'</b><small class="file"> · '+esc(m.status)+' · '+(String(m.visible)==='true'?'Đang hiển thị':'Đang ẩn')+'</small></div><button class="btn" data-edit="'+esc(m.id)+'">Chỉnh sửa</button></div>').join('')+'</section>');$('#module-form').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.visible=$('[name=visible]').checked;try{await call('saveModule',token,v);await refresh('modules')}catch(x){$('#mmsg').innerHTML='<p class="error">'+esc(x.message)+'</p>'}};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let m=state.modules.find(x=>x.id===b.dataset.edit);let f=$('#module-form');Object.keys(m).forEach(k=>f.elements[k]&&(f.elements[k].value=m[k]||''));f.elements.visible.checked=String(m.visible)==='true';f.scrollIntoView({behavior:'smooth'})})}
function approvals(){if(state.user.role!=='ADMIN')return dashboard();layout('approvals','<h1>Duyệt tài khoản</h1><p>Chỉ tài khoản được duyệt mới vào không gian chung và nhận không gian cá nhân.</p><section class="card">'+(state.approvals.length?state.approvals.map(u=>'<div class="row"><div><b>'+esc(u.name)+'</b><small class="file">'+esc(u.email)+' · '+esc(u.phone)+'</small></div><select data-r="'+esc(u.email)+'"><option value="TEACHER">Giáo viên</option><option value="DEPUTY">Tổ phó</option><option value="LEADER">Tổ trưởng</option></select><button class="btn primary" data-ok="'+esc(u.email)+'">Duyệt</button><button class="btn danger" data-no="'+esc(u.email)+'">Từ chối</button></div>').join(''):'<p>Không có yêu cầu chờ duyệt.</p>')+'</section>');document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>approval(b.dataset.ok,true));document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>approval(b.dataset.no,false))}
async function approval(email,ok){try{await call('setApproval',token,email,ok,ok?document.querySelector('[data-r="'+CSS.escape(email)+'"]').value:'TEACHER');await refresh('approvals')}catch(e){alert(e.message)}}
function notebooks(){let leader=['ADMIN','LEADER','DEPUTY'].includes(state.user.role);let list=(state.notebooks||[]).map(n=>'<div class="row"><div><b>'+esc(n.title)+'</b><small class="file"> '+esc(n.meetingTime)+' · '+esc(n.ownerName)+'</small></div><div>'+(n.docUrl?'<a class="btn" target="_blank" href="'+esc(n.docUrl)+'">Mở Docs</a> ':'')+(n.pdfUrl?'<a class="btn primary" target="_blank" href="'+esc(n.pdfUrl)+'">PDF</a>':'')+'</div></div>').join('');let form=leader?'<section class="card"><div class="notebook-header"><p>ỦY BAN NHÂN DÂN PHƯỜNG ĐÔNG HƯNG THUẬN</p><p>TRƯỜNG TIỂU HỌC TRƯƠNG ĐỊNH</p><p>---------------------------------------</p><h2>SỔ HỌP</h2></div><form id="notebook-form" class="form"><label>Tên sổ họp *<input name="title" required placeholder="Ví dụ: Sinh hoạt chuyên môn tuần 1"></label><label>Thời gian *<input name="meetingTime" required value="'+new Date().toLocaleString('vi-VN')+'"></label><label class="full">Người chủ trì *<input name="chair" required value="'+esc(state.user.name)+'"></label><label class="full">Nội dung triển khai *<textarea name="content" required placeholder="Nhập nội dung tại đây..."></textarea></label><label class="full">Chữ ký PNG/JPG (tối đa 1 MB)<input id="signature" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="full sig">Giáo viên<br><br><b>'+esc(state.user.name)+'</b></div><div class="full actions"><button class="btn primary">Lưu sổ họp và tạo PDF</button></div></form><div id="nmsg"></div></section>':'';layout('notebooks','<h1>Sổ ghi chép họp</h1><p>Mỗi số được lưu theo thứ tự thời gian. Khi lưu, hệ thống tạo Google Docs và PDF trong Drive.</p>'+form+'<section class="card"><h2>Sổ đã lưu</h2>'+(list||'<p>Chưa có sổ họp.</p>')+'</section>');if(leader)$('#notebook-form').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target)),f=$('#signature').files[0];if(f){if(f.size>1024*1024){$('#nmsg').innerHTML='<p class="error">Ảnh chữ ký tối đa 1 MB.</p>';return}v.signatureData=await new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}try{await call('saveNotebook',token,v);await refresh('notebooks')}catch(x){$('#nmsg').innerHTML='<p class="error">'+esc(x.message)+'</p>'}}}
async function refresh(page){state=await call('bootstrap',token);app(page)}
token?load():login();
</script></body></html>
